experiment:
  name: gemma_act_patch_peft
  tags: ["fsdp", "peft", "all_layers"]
seed: 42
hf_name: google/gemma-2-2b-it
make_train_data:
  batch_size: 32
layer_segments: [5, 10, 15, 20, 25]

# Training configurations
batch_size: 32
eval_steps: 50
save_steps: 50
test_split: 0.2
epochs: 3
val_split: 0.1
save_total_limit: 2
logging_steps: 10
fsdp: "full_shard auto_wrap"
peft: "lora"
peft_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: "all-linear"
checkpoint_dir: ./src/introspect/activation_patch/artifacts/gemma_act_patch_peft/checkpoints/checkpoint-708
