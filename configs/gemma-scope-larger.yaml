experiment:
  name: gemma_fd_attn_peft
  tags: ["fsdp", "peft", "single"]
seed: 42
single_layer: true
layer_id: 20
hf_name: google/gemma-2-2b
batch_size: 64
target_model: gemma-2-2b
sae: 
  model: gemmascope-res-16k
  layers: 26
val_split: 0.05
test_split: 0.2
epochs: 3
eval_steps: 50
save_steps: 50
save_total_limit: 2
logging_steps: 10
# FSDP configuration
# Simple string option: "full_shard", "shard_grad_op", "no_shard", "full_shard auto_wrap"
fsdp: "full_shard auto_wrap"
peft: "lora"
peft_config:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

